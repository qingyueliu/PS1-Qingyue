name: Import PS1 v2 source

on:
  push:
    paths:
      - ps1-v2-import.tar.gz

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import remaining v2 files
        run: |
          tar -xzf ps1-v2-import.tar.gz
          rm ps1-v2-import.tar.gz
          rm .github/workflows/import-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Complete PS1 v2 source tree"
          git push
